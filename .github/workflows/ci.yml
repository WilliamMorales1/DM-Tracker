name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
          version: latest
          # Prebuilt binaries lag behind go.mod's Go version; build with the toolchain from setup-go.
          install-mode: goinstall

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install -g typescript@6.0.3

      - name: Compile frontend
        run: tsc -p frontend/tsconfig.json

      - name: Validate static frontend
        run: |
          test -f frontend/index.html
          test -f frontend/index.css
          test -f frontend/app/main.js
          test -f frontend/vendor/marked.esm.js
          test -f frontend/vendor/monaco/min/vs/loader.js
          test ! -e frontend/package.json
          test ! -e frontend/package-lock.json
          test ! -d frontend/node_modules
          ! grep -RInE 'jsdelivr.net/npm|frontend/dist' frontend/app --include=*.js

      - name: Run frontend logic tests
        run: node --test frontend/test/monster-scaling.test.mjs
